# Request fields for an Entra on-behalf-of exchange. This repository does not
# implement an OBO endpoint or a live exchange test.
grant_type: urn:ietf:params:oauth:grant-type:jwt-bearer
requested_token_use: on_behalf_of
scope: api://downstream/.default
assertion: ${SYNTHETIC_ASSERTION}
client_id: ${CLIENT_ID}
client_secret: ${CLIENT_SECRET}
