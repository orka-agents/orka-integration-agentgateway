apiVersion: core.orka.ai/v1alpha1
kind: OutboundAccessPolicy
metadata:
  name: agentgateway
  namespace: orka-system
spec:
  gateway:
    serviceRef:
      name: orka-egress
      namespace: orka-system
      port: 8080
    scheme: http
---
apiVersion: core.orka.ai/v1alpha1
kind: Tool
metadata:
  name: downstream-api
  namespace: orka-system
spec:
  description: Calls a downstream API through agentgateway
  http:
    url: https://example.com/v1/resource?version=1
    method: POST
    outboundAccessPolicyRef:
      name: agentgateway
